# config.yaml for the AWS box. boot.sh copies it over $HERMES_HOME/config.yaml on every boot,
# so change behaviour here, push, and reboot. Secrets: Secrets Manager "anvento-hermes/env".
model:
  provider: "bedrock"
  default: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
bedrock:
  region: "us-east-1"   # credentials come from the instance role
terminal:
  # Shell commands from Slack run in a container: no access to .env or the instance role.
  backend: "docker"
  container_memory: 1024   # MB; t4g.small has 2 GB
# Open access is Slack-only (SLACK_ALLOW_ALL_USERS=true in the secret). A top-level allow_all_users
# would also admit any sender on the internet by email.
slack:
  # Admins run every slash command; everyone else gets /help, /whoami + these.
  allow_admin_from: ["U0APQM7SVK9", "U09CEQ1QQ87"]
  group_allow_admin_from: ["U0APQM7SVK9", "U09CEQ1QQ87"]
  user_allowed_commands: [new, stop, status]
  group_user_allowed_commands: [new, stop, status]
  gateway_restart_notification: false   # a reboot-deploy would otherwise post in Slack
platforms:
  email:
    extra:
      # Google Workspace's receiving server; Hermes trusts only the From: it authenticated.
      # Account, password and EMAIL_ALLOWED_USERS live in the secret (README: Email).
      authserv_id: "mx.google.com"
      # TEMPORARY: anventolabs.com has no SPF and no aligned DKIM, so Google can't authenticate our own
      # senders and every one is dropped. Until DNS is fixed, From: is trusted as written, which means
      # anyone can forge an allowed sender. Remove this once the DNS fix lands
      # (harmeet/todo_longterm.md §5).
      require_authenticated_sender: false
